services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: maintops-web-vue3-dev
    container_name: maintops-web-vue3
    working_dir: /app
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      FRONTEND_ALLOWED_HOSTS: ${FRONTEND_ALLOWED_HOSTS:-localhost,127.0.0.1}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
      VITE_REALTIME_URL: ${VITE_REALTIME_URL:-http://localhost:3000}
      VITE_ANALYTICS_BASE_URL: ${VITE_ANALYTICS_BASE_URL:-http://localhost:8001}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5173').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  node_modules:
